name = "karl-narrator"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fase 2 (se plan/feature-live-narrator-1.md, TASK-002-004): ét globalt,
# navngivet Durable Object er den eneste stateful komponent — rate limit
# pr. IP-hash, det daglige opstrømsloft og den delte cache bor alle i dets
# egen SQLite-baserede storage. Ingen KV ved siden af med vilje: ét
# stateful binding er nemmere at ræsonnere om og drifte end to.
[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

[[durable_objects.bindings]]
name = "RUNS"
class_name = "Run"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Run"]

[vars]
# Kun spillets egen adresse må kalde. Tom værdi = alle, hvilket kun bør bruges
# lokalt: nøglen er workerens, og den betaler for hvert kald.
ALLOWED_ORIGINS = "https://youex.github.io"
MODEL = "gpt-4o-mini"
RUNTIME_COMMENTARY_MODEL = "gpt-4.1-nano-2025-04-14"

# --- Rate limit pr. IP-hash, rullende vindue (TASK-002, SEC-001) ---
# Grundlaget er IKKE en gættet rund tal, men heller ikke en direkte målt
# "forespørgsler pr. minut" — den simulering vi har (tools/pair_frequency.ts,
# 1.200 runs) måler PAR PR. RUN, ikke virkelig forløbet tid mellem klik, så
# den kan ikke alene sætte et rullende 60-sekunders vindue. Udregningen:
#   1) Det MÅLTE, hårde loft pr. run er 50 (content/config.json's
#      turnLimit, bekræftet af simuleringen: attempts/run har p95=50 og
#      max=50 over alle 1.200 runs — simuleringen rammer altid loftet eller
#      slutter før). prefetchLine() (src/ui/main.ts) kaldes ved hvert
#      udfyldt par, som er en overmængde af selve combine-forsøgene.
#   2) Hvert par kræver mindst to fysiske handlinger (vælg A, vælg B), et
#      egentligt forsøg en tredje (tryk combine). Selv en meget hurtig
#      spiller, der ikke læser noget og bare klikker, kan næppe gøre dette
#      hurtigere end ca. hvert 1.-2. sekund i træk — så et helt 50-parrers
#      run kan fysisk ikke gennemføres på under ca. 50-100 sekunder.
#   3) 20 kald / 60 sek. ligger dermed komfortabelt under halvdelen af et
#      helt runs loft inden for ethvert givent minut — rigeligt til en
#      ægte spillers hurtigste realistiske byge — men strammer hurtigt om
#      en klient uden den menneskelige klikke-forsinkelse.
# Se plan/feature-live-narrator-1.md (TASK-002) for selve udregningen.
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_MAX = "20"

# --- Dagligt UTC-loft over kald der når opstrøms (TASK-003, SEC-001) ---
# `src/ui/main.ts`s `prefetchLine()` spørger for ALLE ikke-opskrift-par —
# også dem der har en bagt replik og derfor aldrig bruger svaret — for den
# tjekker kun `matchCombo`, ikke om linjen allerede er bagt. Derfor tæller
# udregningen ALLE nofuse-par, ikke kun de ubagte. Distinkte par+dom-nøgler
# pr. run (tools/pair_frequency.ts, 1.200 simulerede runs, genmålt for
# sikkerhedsrunde 2 efter rebase mod main — samme facit) har gennemsnit
# ~25,4 og 95.-percentil 33 (se `perRunDistinctPairVerdictKeys` i
# docs/design/pair-frequency.json). Antaget (IKKE målt — der findes endnu
# ingen rigtig trafik): op til ~10 fulde gennemspilninger på den travleste
# realistiske dag for et lille, ikke-viralt spil. 10 × 33 ≈ 330, uden
# fradrag for genbrug på tværs af de 10 runs samme dag (et bevidst
# konservativt, for-højt skøn). 350 runder det op med lidt margin.
DAILY_MAX_UPSTREAM_CALLS = "350"

# --- Én IP-hashs egen andel af samme døgn (sikkerhedsrunde 2, punkt 2) ---
# Uden dette kan én spiller (eller angriber) alene opbruge HELE det globale
# loft og lukke laget ned for alle andre resten af døgnet. Grundlaget er det
# SAMME målte tal som ovenfor — 95.-percentilen af distinkte par+dom-nøgler
# pr. run, altså 33 — men ganget med et LILLE, eksplicit antaget antal fulde
# gennemspilninger for ÉN spiller på én dag, ikke for hele spillerbasen:
# 33 × 5 ≈ 165. Fem er bevidst rigeligt (en almindelig spiller gennemfører
# spillet højst én eller to gange; selv en meget ihærdig tester på 5 fulde
# runs samme dag er en yderst usædvanlig, men stadig ærlig, brugsprofil).
# 165 er samtidig meningsfuldt UNDER halvdelen af det globale loft (350):
# én IP kan aldrig alene opbruge mere end knap halvdelen af døgnets
# samlede budget, uanset hvor ihærdig eller ondsindet den er — resten af
# spillerbasen kan altid stadig få svar. Rammes dette loft, svarer
# koordinatoren 429 (en klient-specifik grænse, ligesom rate-limit-vinduet),
# IKKE 503 (som er forbeholdt det GLOBALE loft) — se `worker/src/coordinator.ts`.
DAILY_MAX_UPSTREAM_CALLS_PER_IP = "165"

# --- Improvisation: egne serverkvoter, uafhængigt af fortælleren ---
# Kilden er fortsat slukket og ikke deployet. Tallene er konservative
# før-trafik-standarder, ikke produktionsmålinger: klientens senere run-cap
# er UX/balance og må aldrig regnes som en sikkerhedsgrænse.
IMPROVISE_RATE_LIMIT_WINDOW_SECONDS = "60"
IMPROVISE_RATE_LIMIT_MAX = "10"
IMPROVISE_DAILY_MAX_UPSTREAM_CALLS = "100"
IMPROVISE_DAILY_MAX_UPSTREAM_CALLS_PER_IP = "25"

# --- Run-specifik fortællerkommentar: separat fra pair-copy og gameplay ---
# Kun betydningsfulde cues kan nå denne sti, og Run Durable Object'et
# konstruerer hele promptkonteksten. Tallene er konservative før-trafik-
# standarder og skal genmåles før production-enable.
RUNTIME_COMMENTARY_RATE_LIMIT_WINDOW_SECONDS = "60"
RUNTIME_COMMENTARY_RATE_LIMIT_MAX = "12"
RUNTIME_COMMENTARY_DAILY_MAX_UPSTREAM_CALLS = "500"
RUNTIME_COMMENTARY_DAILY_MAX_UPSTREAM_CALLS_PER_IP = "100"

# --- Streamet runtime-TTS: egen udgiftsgrænse ---
RUNTIME_TTS_RATE_LIMIT_WINDOW_SECONDS = "60"
RUNTIME_TTS_RATE_LIMIT_MAX = "12"
RUNTIME_TTS_DAILY_MAX_UPSTREAM_CALLS = "500"
RUNTIME_TTS_DAILY_MAX_UPSTREAM_CALLS_PER_IP = "100"

# IP-hashens saltning (sikkerhedsrunde 2, punkt 1) — OBLIGATORISK, ingen
# fallback. Uden salt er en SHA-256-hash af en IP i praksis en opslagstabel
# væk fra at være "klar tekst": IPv4-rummet er lille nok til at regne alle
# ca. 4 milliarder hashes ud på forhånd og slå den rå IP op igen. Sættes
# som secret, ALDRIG som en almindelig var her (hemmeligheden må ikke stå i
# klartekst i denne fil, og slet ikke i git-historikken):
#   npx wrangler secret put IP_HASH_SALT
# Mangler den ved runtime, fejler `worker/src/index.ts` LUKKET (503) for
# ALLE forespørgsler, i stedet for at hashe med et gættet standard-salt —
# se `index.ts`s `Env.IP_HASH_SALT`-dokumentation.

# Nøglen sættes som secret, aldrig i denne fil:
#   npx wrangler secret put OPENAI_API_KEY
#
# Run-capabilities for /api/v1/runs are HMAC-signed with a separate secret:
#   npx wrangler secret put RUN_AUTH_SECRET
# Missing secret keeps /healthz red and run creation closed.
#
# Cartesia streams the accepted runtime line through the pinned Archie en-GB
# voice. Missing secret keeps gameplay and text commentary available; health
# reports runtimeVoiceAvailable=false and the browser uses exact-text local TTS.
#   npx wrangler secret put CARTESIA_API_KEY
