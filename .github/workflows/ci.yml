name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manuel start: under GitHubs Actions-nedbrud 2026-08-06 blev push- og
  # pull_request-events droppet, og der var ingen måde at få CI til at køre
  # igen uden en tom commit.
  workflow_dispatch:

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validér indhold
        run: python3 tools/validate.py

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck + build
        run: npm run build

  ux-audit:
    # UX-dommeren (docs/design/ux-checklist.md). Kræver en rigtig browser:
    # flugtveje, fokus og history kan ikke testes i jsdom.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hent Chromium
        run: npx --yes playwright@1.50.0 install --with-deps chromium
      - name: Start dev-server
        run: |
          npx vite --port 5199 --strictPort &
          npx wait-on http://localhost:5199/ --timeout 60000
      - name: UX-audit
        run: npm run ux
