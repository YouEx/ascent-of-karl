name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manuel start: under GitHubs Actions-nedbrud 2026-08-06 blev push- og
  # pull_request-events droppet, og der var ingen måde at få CI til at køre
  # igen uden en tom commit.
  workflow_dispatch:

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validér indhold
        run: python3 tools/validate.py
      - name: Prøv prædikaterne mod facit
        run: python3 tools/predicate_report.py

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Kontrollér improvisationsbalance
        run: npm run improvise:report:check
      - name: Typecheck + build
        run: npm run build

  worker-typecheck:
    # Sikkerhedsrunde 2, punkt 6: worker/ er en selvstændig pakke med sin
    # egen package-lock.json og wrangler-afhængighed — roddens `npm ci`
    # (test-and-build) rører den aldrig, og rodens `npm run build` typjekker
    # kun workeren med rodens EGEN typescript (ingen workerafhængigheder
    # krævet dertil, se worker/tsconfig.json). Denne job kører derfor
    # workerens EGEN npm ci og et ægte wrangler-bundle (dry-run — ingen
    # deploy, intet Cloudflare-login krævet, se verifikation i
    # docs/deployment/live-narrator.md).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Typjek workeren
        run: npm run typecheck
      - name: Bundl workeren (dry-run, ingen deploy)
        run: npm run dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

  ux-audit:
    # UX-dommeren (docs/design/ux-checklist.md). Kræver en rigtig browser:
    # flugtveje, fokus og history kan ikke testes i jsdom.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Uden version: bruger projektets egen playwright, så browser-build og
      # bibliotek matcher. En pinnet version her hentede v1155, mens
      # biblioteket ville have v1234, og jobbet fejlede.
      - name: Hent Chromium
        run: npx playwright install --with-deps chromium
      - name: Start dev-server
        run: |
          npx vite --port 5199 --strictPort &
          npx wait-on http://localhost:5199/ --timeout 60000
      - name: UX-audit
        run: npm run ux
