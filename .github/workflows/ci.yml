name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manuel start: under GitHubs Actions-nedbrud 2026-08-06 blev push- og
  # pull_request-events droppet, og der var ingen måde at få CI til at køre
  # igen uden en tom commit.
  workflow_dispatch:

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validér indhold
        run: python3 tools/validate.py
      - name: Prøv prædikaterne mod facit
        run: python3 tools/predicate_report.py

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kontrollér produktformål, kontrakter, graf og agentkontekst
        run: npm run product:check
      - name: Unit tests
        run: npm test
      - name: Kontrollér improvisationsbalance
        run: npm run improvise:report:check
      - name: Typecheck + build
        run: npm run build
      # `npm run build` måler et løst `vite build` — en variant, der udgives
      # ingen steder. Uden dette trin blev de to bundter, brugerne faktisk
      # henter, først budgetmålt i deploy.yml, altså EFTER merge til main. Her
      # bygges og verificeres hele Pages-artifactet, så et budgetbrud i en
      # udgivet variant stopper pull requesten i stedet for udgivelsen.
      # `build_pages.mjs` kalder selv `verifyPagesArtifact` til sidst og falder
      # med exit 1, hvis den fejler (målt), så et separat `pages:verify`-trin
      # ville aldrig kunne fejle for sig — deploy.yml kører derfor også kun
      # dette ene kald.
      - name: Byg og verificér Pages-artifactet (begge udgivne varianter)
        run: npm run build:pages

  worker-typecheck:
    # Sikkerhedsrunde 2, punkt 6: worker/ er en selvstændig pakke med sin
    # egen package-lock.json og wrangler-afhængighed — roddens `npm ci`
    # (test-and-build) rører den aldrig, og rodens `npm run build` typjekker
    # kun workeren med rodens EGEN typescript (ingen workerafhængigheder
    # krævet dertil, se worker/tsconfig.json). Denne job kører derfor
    # workerens EGEN npm ci og et ægte wrangler-bundle (dry-run — ingen
    # deploy, intet Cloudflare-login krævet, se verifikation i
    # docs/deployment/live-narrator.md).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Typjek workeren
        run: npm run typecheck
      - name: Bundl workeren (dry-run, ingen deploy)
        run: npm run dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

  ux-audit:
    # UX-dommeren (docs/design/ux-checklist.md). Kræver en rigtig browser:
    # flugtveje, fokus og history kan ikke testes i jsdom.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Installér titel-dommerens Python-afhængigheder
        run: python3 -m pip install -r tools/judge/requirements.txt
      # Uden version: bruger projektets egen playwright, så browser-build og
      # bibliotek matcher. En pinnet version her hentede v1155, mens
      # biblioteket ville have v1234, og jobbet fejlede.
      - name: Hent Chromium
        run: npx playwright install --with-deps chromium
      - name: Test titel-fidelity-v2 med portable fixtures
        run: TITLE_FIDELITY_TESTS=1 npx vitest run tests/title-fidelity-v2.test.ts tests/judge-capture.test.ts
      # Kunstpipelinens pytest-suite var aldrig blevet kaldt i CI, selv om
      # planens stack-tabel udpeger "Vitest + Python pytest" som portlaget — og
      # selv om pytest hele tiden er blevet INSTALLERET her på linjen ovenfor.
      # 136 tests, der bevogter promoveringsportene, godkendelsesbindingen og
      # den atomare udgivelse, kørte altså kun når nogen huskede det lokalt.
      #
      # De to fravalgte er MÅLT platformafhængige, ikke antaget: i kørsel
      # 31893531831 gav Linux maxTileLag 48 mod macOS' 16 for den samme
      # fixture, og det committede bevismateriale er ikke byte-identisk med en
      # Linux-genereret WebP. Begge kører fortsat lokalt på den maskine, hvor
      # kunsten faktisk fremstilles. Bliver en af dem omdøbt, holder fravalget
      # op med at ramme, og testen kører — altså rødt CI, ikke tavs udeladelse.
      - name: Test kunstpipelinen (promoverings- og udgivelsesporte)
        run: |
          python3 -m pytest tools/art/tests -q \
            --deselect "tools/art/tests/test_build_title_scene_masters.py::test_repeated_sixteen_row_extension_fixture_fails_repeat_gate" \
            --deselect "tools/art/tests/test_build_title_scene_masters.py::test_committed_blocker_evidence_is_fresh_and_no_master_is_promoted"
      # Safe stacked merge: Phase A auditerer og gemmer røde mål, men gør ikke
      # main rød. Phase D ændrer dette kald til `-- --require-green`, efter at
      # de fire krævede assetlag og asset-kontrakten er integreret.
      - name: Auditér titel-fidelity på produktionscapturen
        run: npm run judge:title-fidelity
      - name: Start dev-server
        run: |
          npx vite --port 5199 --strictPort &
          npx wait-on http://localhost:5199/ --timeout 60000
      - name: UX-audit
        run: npm run ux
